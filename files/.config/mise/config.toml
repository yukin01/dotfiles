[tools]
# Language runtimes
deno = "2.9"
node = "24"
ruby = "4.0"
bun = "latest"
go = "latest"
uv = "latest"

# JS package managers
pnpm = "latest"
"npm:yarn" = "latest"

# Kubernetes
argo-rollouts = "1.10"
argocd = "3.5"
helm = "4.3"
kubectl = "1.35"
kustomize = "5.8"
dyff = "latest"
k9s = "latest"
kind = "latest"
kube-score = "latest"
kubeconform = "latest"
kubectx = "latest"
kubens = "latest"
pluto = "latest"
skaffold = "latest"
trivy = "latest"
"github:awslabs/eks-node-viewer" = { version = "latest", bin = "eks-node-viewer" }

# IaC / Infra
sops = "latest"
terraform-docs = "latest"
tflint = "latest"
tfupdate = "latest"
"github:datadog-labs/pup" = "latest"
"github:tofuutils/tenv" = "latest"

# CI / Lint
act = "latest"
actionlint = "latest"
hadolint = "latest"
pinact = "latest"
shellcheck = "latest"
zizmor = "latest"

# Git tools
delta = "latest"
gh = "latest"
ghq = "latest"
gitleaks = "latest"
hunk = "latest"
lazygit = "latest"
"github:tomasz-tomczyk/crit" = "latest"

# Terminal environment
direnv = "latest"
herdr = "latest"
neovim = "latest"
starship = "latest"

# CLI utilities
bat = "latest"
fd = "latest"
fx = "latest"
fzf = "latest"
jnv = "latest"
jq = "latest"
peco = "latest"
ripgrep = "latest"
yazi = "latest"
yq = "latest"

# npm packages
"npm:@google/gemini-cli" = "latest"
"npm:@marp-team/marp-cli" = "latest"
"npm:aws-cdk" = "latest"
"npm:ccusage" = "latest"
"npm:firebase-tools" = "latest"
"npm:prettier" = "latest"
"npm:serverless" = "latest"

# pipx packages
"pipx:ansible-core" = "latest"

[settings]
experimental = true

[settings.pipx]
uvx = true
